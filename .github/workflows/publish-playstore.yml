name: Publish Android App to Play Store

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2️⃣ Setup JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # 3️⃣ Create local.properties (WAJIB untuk lint/build)
      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          echo "CLIENT_ID=${{ secrets.CLIENT_ID }}" >> local.properties

      # 4️⃣ Decode keystore (SIGNING)
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks
          echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/keystore.jks" >> $GITHUB_ENV

      # 5️⃣ Create Play service account json
      - name: Create Play service account json
        run: |
          echo '${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}' > play-account.json
          echo "PLAY_SERVICE_ACCOUNT_JSON=$GITHUB_WORKSPACE/play-account.json" >> $GITHUB_ENV

      # 6️⃣ Extract version from tag (opsional, tapi rapi)
      - name: Extract version name from tag
        run: |
          VERSION_NAME=${GITHUB_REF#refs/tags/v}
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV

      # 7️⃣ Permission gradlew
      - name: Grant execute permission
        run: chmod +x gradlew

      # 8️⃣ Build AAB (Release)
      - name: Build Release Bundle
        run: ./gradlew bundleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      # 9️⃣ Publish to Play Store (Internal – Draft)
      - name: Publish to Play Store (Internal Draft)
        run: ./gradlew publishReleaseBundle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}