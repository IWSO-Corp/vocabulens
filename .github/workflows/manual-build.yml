name: Manual Build

on:
  workflow_dispatch:

jobs:
  manual:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute
        run: chmod +x gradlew

      - name: Build Debug
        run: ./gradlew assembleDebug